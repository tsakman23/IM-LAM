defaults:
  - sl_default
  - fabric/default
  - logger/wandb
  - _self_

stage_run_id: ${run_id}-3

logger:
  project: lapo
  tags: [lapo, bc, impala_encoder, stage_3]

trainer:
  validation_frequency: 1
  max_epochs: 10
  previous_stage_checkpoint: ${trainer.checkpoint_dir}/${run_id}-2

env:
  name: procgen-bigfish-v0
  block_size: 1

dataset:
  name: ${env.name}
  subset_size: 64e3
  block_size: ${env.block_size}

module:
  _target_: ifo.modules.bc.module.BehaviorCloningModule
  _recursive_: False
  batch_size: 512
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-3
  lr_scheduler: null
  num_workers: 8
  max_grad_norm: null

net:
  _target_: ifo.modules.lapo_bc.nets.LAPOBCActorAgent
  _partial_: True
  channel_multiplier: 4
  code_dim: 128
  hidden_dim: 256
  box_head_distribution: "mse"
  categorical_head_distribution: "categorical"

rollout_callback:
  _target_: ifo.modules.bc.callbacks.RolloutCallback
  rollout_steps: 1e5
  rollout_frequency: 1
  rollout_exploration_mode: sample