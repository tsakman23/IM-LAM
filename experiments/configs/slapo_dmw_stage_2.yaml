defaults:
  - slapo_default_stage_2
  - _self_

trainer:
  max_epochs: 4

env:
  name: Meta-World/masked-MT1-push-v3

dataset:
  # Authors' agent-mask-only release - used by the MaskLAM baseline arm. The object-loss
  # arms (Foreground-MaskLAM union/dual, IM-LAM) use foreground_masklam_dmw_stage_2
  # instead, which pins the regenerated tsakman23 repo so every stage of an arm runs on
  # the same dataset. Stages 2/3 never read object masks in either case.
  dataset_path: EpicPinkPenguin/visual_distracting_metaworld
  with_object_mask: false

module:
  batch_size: 128
  optimizer:
    _target_: torch.optim.AdamW
    lr: 2e-4
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 31250
    eta_min: 0.0