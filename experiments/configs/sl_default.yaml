run_id: null
stage_run_id: ${run_id}
headless: false

trainer:
  _target_: ifo.common.trainer.SupervisedTrainer
  fabric: ???
  compile: False
  # Base path to save checkpoints and to automatically load the latest checkpoint from, when available.
  # The actual checkpoint directory is a combination of the experiment run_id and the stage number.
  checkpoint_dir: ./checkpoints
  validation_criteria: min
  validation_frequency: 1
  validation_unit: epoch
  max_epochs: 1
  max_steps: null
  limit_train_batches: .inf
  limit_val_batches: .inf
  # Path to load a specific checkpoint from. Overrides automatic loading from checkpoint_dir.
  checkpoint_path: null
  random_seed: null
  # Metric prefix / per-stage 0-based W&B step axis, set per stage by the in-process pipeline
  # runner (experiments/run_slapo.py). null = legacy single-stage logging (native step, unprefixed).
  log_prefix: null

env:
  _target_: ifo.common.utils.env.make_env
  name: ???
  num_envs: 1
  block_size: 1
  video_folder: videos
  step_trigger: 1e4
  video_length: 2e2
  action_repeat: 1

dataset:
  _target_: ifo.common.utils.data.get_dataset
  name: ${env.name}
  # Persist the built dataset next to the run's data (matches scripts/download_dataset.py's
  # default and the documented run commands) so a pre-downloaded cache is reused without a
  # CLI override. Was /tmp/datasets (ephemeral, off the shared /data2 disk).
  cache_dir: ./datasets/slapo/${env.name}
  block_size: 1