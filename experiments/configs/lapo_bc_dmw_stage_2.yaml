defaults:
  - lapo_bc_dcs_stage_2
  - _self_

trainer:
  max_epochs: 4

env:
  name: Meta-World/masked-MT1-button-press-v3

dataset:
  # See lapo_bc_dmw_stage_1.yaml - same rationale, kept consistent across stages 1-3.
  dataset_path: EpicPinkPenguin/visual_distracting_metaworld
  with_object_mask: false

module:
  batch_size: 128
  optimizer:
    _target_: torch.optim.AdamW
    lr: 2e-4
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 31250
    eta_min: 0.0