defaults:
  - slapo_default_stage_1
  - _self_

trainer:
  max_epochs: 4

env:
  name: Meta-World/masked-MT1-push-v3

dataset:
  # MaskLAM baseline: pin the authors' agent-mask-only release explicitly (rather than relying on
  # MetaWorldDataset's built-in default) so the dataset choice lives in config, not on the CLI.
  # Foreground-MaskLAM inherits this file and overrides both keys in
  # foreground_masklam_dmw_stage_1 to point at the object-mask repo.
  dataset_path: EpicPinkPenguin/visual_distracting_metaworld
  with_object_mask: false

module:
  batch_size: 128
  optimizer:
    _target_: torch.optim.AdamW
    lr: 3e-4
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 31250
    eta_min: 0.0
