run_id: null
stage_run_id: ${run_id}
headless: false

trainer:
  _target_: ifo.common.trainer.SupervisedTrainer
  fabric: ???
  compile: False
  # Base path to save checkpoints and to automatically load the latest checkpoint from, when available.
  # The actual checkpoint directory is a combination of the experiment run_id and the stage number.
  checkpoint_dir: ./checkpoints
  validation_criteria: min
  validation_frequency: 1
  validation_unit: epoch
  max_epochs: 1
  max_steps: null
  limit_train_batches: .inf
  limit_val_batches: .inf
  # Path to load a specific checkpoint from. Overrides automatic loading from checkpoint_dir.
  checkpoint_path: null
  random_seed: null

env:
  _target_: ifo.common.utils.env.make_env
  name: ???
  num_envs: 1
  block_size: 1
  video_folder: videos
  step_trigger: 1e4
  video_length: 2e2
  action_repeat: 1

dataset:
  _target_: ifo.common.utils.data.get_dataset
  name: ${env.name}
  cache_dir: /tmp/datasets
  block_size: 1