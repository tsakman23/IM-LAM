# IM-LAM - Stage 1, dual loss with object-term WARM-UP.
#
# Identical to imlam_dual_dmw_stage_1 (same interaction FDM, same dual loss) except lambda_o is
# ANNEALED rather than held at 1.0 from step 0. Applying the full object budget immediately drives a
# latent-scale runaway in IM-LAM (the dual loss's amplified small-object gradient hits the single
# z -> F_A injection pathway before the agent branch and z have settled; the action decoder's NMSE
# explodes to 1e6+ and reconstruction stalls). Under the union loss - and under FG-dual - the same
# object supervision is stable, so the fix is to WARM the object term up:
#
#   hold lambda_o = 0 for `hold_steps` (object branch dormant, agent pathway + z stabilize like the
#   stable union regime), then ramp linearly to `end` over `anneal_steps`, then hold.
#
# ObjectLossWeightAnneal mutates the module's object_loss_weight BUFFER in place (torch.compile safe).
# Stages 2/3 are unchanged (foreground_masklam_dmw_stage_{2,3}). Tune hold_steps/anneal_steps per task.
defaults:
  - imlam_dual_dmw_stage_1
  - _self_

module:
  # Initialize the buffer at the anneal START; the callback drives it from here every step. Keep equal
  # to object_loss_weight_anneal.start below.
  object_loss_weight: 0.0

object_loss_weight_anneal:
  _target_: ifo.modules.slapo.callbacks.ObjectLossWeightAnneal
  start: 0.0
  end: 1.0
  hold_steps: 2000     # object term off while the agent pathway + z settle (z destabilizes by ~step 500)
  anneal_steps: 4000   # then ramp 0 -> 1 over steps 2000-6000; held at 1.0 afterward
